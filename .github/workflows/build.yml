name: 编译内核

on:
  push:
    branches:
      - dev/*
      - stable/*
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android16
  AOSP_CLANG_VERSION: r547379

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-latest
    outputs:
      resukisu_ver: ${{ steps.calc_ver.outputs.resukisu_ver }}
    strategy:
      matrix:
        device:
          - beryllium
          - dipper
          - equuleus
          - perseus
          - polaris
          - ursa
    steps:
      - name: 安装软件包
        if: env.PACKAGES != ''
        env:
          PACKAGES:
            binutils-aarch64-linux-gnu
            binutils-arm-linux-gnueabi
        run: |
          sudo apt-get update  -y -q
          sudo apt-get install -y -q ${{ env.PACKAGES }}

      - name: 安装make4.4.1-2
        run: |
          curl -LSs http://ftp.debian.org/debian/pool/main/m/make-dfsg/make_4.4.1-2_amd64.deb -o make.deb
          sudo apt-get install -y -q ./make.deb
          rm ./make.deb
      - name: 同步仓库
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: 拉取子模块完整历史并转换为目录
        id: calc_ver
        working-directory: kernel
        run: |
          git submodule update --init --recursive
          rm ReSukiSU/.git
          mv .git/modules/ReSukiSU ReSukiSU/.git
          
          # 使用 sed 直接修改文本，删除失效的 worktree 配置（绕过 git 本身的路径检查）
          sed -i '/worktree =/d' ReSukiSU/.git/config
          
          cd ReSukiSU
          echo "=== 验证子模块历史记录 ==="
          git log --oneline -n 5

          SUBMODULE_COUNT=$(git rev-list --count HEAD)
          VERSION_NUM=$((SUBMODULE_COUNT + 30700))
          echo "resukisu_ver=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: 缓存Clang
        id: cache-clang
        uses: actions/cache/restore@main
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载Clang
        id: download_clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -c -t 10 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" -O clang.tgz
          tar -zxvf clang.tgz -C clang/

      - name: 保存Clang
        if: always() && steps.cache-clang.outputs.cache-hit != 'true' && steps.download_clang.outcome == 'success'
        uses: actions/cache/save@main
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 缓存ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: kernel-${{ matrix.device }}
          restore-keys: kernel-${{ matrix.device }}
          max-size: 5G

      - name: 编译
        working-directory: kernel
        env:
          MAKE_ARGS:
            -j$(nproc --all)
            O=out
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            LD=ld.lld
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          CONFIG_FILES:
            vendor/xiaomi/mi845_defconfig
            vendor/xiaomi/${{ matrix.device }}.config
            lxc.config
            pstore.config
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP=`date -u -d "@$(git log -1 --format=%at)" +"%a %b %d %H:%M:%S %Z %Y"`
          make ${{ env.MAKE_ARGS }} ${{ env.CONFIG_FILES }} all

      - name: 打包(AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          cat >anykernel.sh <<EOF
          properties() { '
          kernel.string=Kernel for ${{ matrix.device }}
          device.name1=${{ matrix.device }}
          do.devicecheck=1
          '; }
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          is_slot_device=auto
          block=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF
          zip -qr9 Anykernel3-${{ matrix.device }}.zip * -x .git .github README.md *placeholder

      - name: 上传文件
        uses: actions/upload-artifact@main
        with:
          name: kernel-${{ matrix.device }}-ak3
          path: ak3/Anykernel3-${{ matrix.device }}.zip

  release:
    name: 发布与通知
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build

    steps:
      # --------- 1. 下载内核编译产物 ---------
      - name: 获取构建产物
        uses: actions/download-artifact@v4
        with:
          path: kernel
          pattern: kernel-*
          merge-multiple: true

      # --------- 2. 生成上海时间与时间戳 ---------
      - name: 获取当前时间
        id: time
        run: |
          NOW=$(date +%s)
          TIME_STR=$(TZ='Asia/Shanghai' date -d "@$NOW" +'%Y-%m-%d %H:%M')
          echo "timestamp=$NOW" >> $GITHUB_OUTPUT
          echo "time=$TIME_STR" >> $GITHUB_OUTPUT

      # --------- 3. 创建 GitHub Release 并上传文件 ---------
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: rel-${{ steps.time.outputs.timestamp }}
          name: Kernel Build [${{ steps.time.outputs.time }}]
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: |
            kernel/*

# --------- 4. 组装美化版消息并发送至 Telegram ---------
      - name: 发送 Telegram 通知
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

        run: |
          # 1. 动态构建 sendMediaGroup 所需的 JSON 和文件映射参数
          MEDIA_JSON="["
          CURL_FILES=()
          COUNT=0

          for FILE in kernel/Anykernel3-*.zip; do
            if [ -f "$FILE" ]; then
              if [ $COUNT -gt 0 ]; then
                MEDIA_JSON+=","
              fi
              # 构造类似 attach://file_0 的内部引用标识
              MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://file_$COUNT\"}"
              CURL_FILES+=("-F" "file_$COUNT=@$FILE")
              COUNT=$((COUNT + 1))
            fi
          done
          MEDIA_JSON+="]"

          # 如果没有文件，直接退出
          if [ $COUNT -eq 0 ]; then
            echo "未找到任何 Anykernel3 刷机包！"
            exit 1
          fi

          # 2. 一键发送整组文件，并捕获这一组消息中第一个文件的 message_id
          echo "正在批量上传 $COUNT 个内核文件..."
          RESPONSE=$(curl -LSs -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMediaGroup \
                -F "chat_id=${{ vars.TELEGRAM_CHAT_ID }}" \
                -F "message_thread_id=${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}" \
                -F "media=$MEDIA_JSON" \
                "${CURL_FILES[@]}")

          # sendMediaGroup 成功后返回的是一个消息数组，提取第一个消息的 ID 用于后续回复
          LAST_MSG_ID=$(echo "$RESPONSE" | jq -r '.result[0].message_id // empty')


          # 3. 提取并处理提交 ID（保持你原有的逻辑）
          IDS=(${{ join(github.event.commits.*.id, ' ') }})
          MAX=5
          if [ "${#IDS[@]}" -gt "$MAX" ]; then
            COMMIT_IDS_TEXT="$(printf "• %s\n" "${IDS[@]:0:$MAX}"; echo "• ...更多提交请查看对比差异")"
          else
            COMMIT_IDS_TEXT="$(printf "• %s\n" "${IDS[@]}")"
          fi

          # 4. 组装你的美化文本
          SAFE_MSG=$(echo "$COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\\"/g')
          MSG="<b>New Release！</b>
          ──────────────────────
          <b>适用设备:</b>
            ├─ POCO F1 <code>(beryllium)</code>
            ├─ 小米 MIX 2S <code>(polaris)</code> / MIX 3 <code>(perseus)</code>
            └─ 小米 8 标准/探索/Pro <code>(dipper / ursa / equuleus)</code>
          <b>适用系统:</b> <code>类原生 ROM</code>
          <b>源码仓库:</b> <a href='${{ github.server_url }}/${{ github.repository }}'>${{ github.repository }}</a>
          <b>ReSukiSU版本号:</b> <code>${{ needs.build.outputs.resukisu_ver }}</code>
          <b>编译时间:</b> <code>${{ steps.time.outputs.time }}</code>
          <b>提交描述:</b> <code>$SAFE_MSG</code> 
          <b>工作流详情:</b> <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>点击前往查看</a>
          ──────────────────────
          <i>上方已附带各机型 Anykernel3 刷机包，请对号入座下载</i>"

          PREVIEW_OPTIONS="{ \"url\": \"${{ steps.release.outputs.url }}\", \"prefer_small_media\": true, \"show_above_text\": true }"
          BUTTONS="{\"inline_keyboard\": [ [ { \"text\": \"📥 下载内核产物\", \"url\": \"${{ steps.release.outputs.url }}\" }, { \"text\": \"🔍 对比代码差异\", \"url\": \"${{ github.event.compare }}\" } ] ] }"

          # 5. 组装发送文本的参数
          MSG_ARGS=(
            --form-string "chat_id=${{ vars.TELEGRAM_CHAT_ID }}"
            --form-string "message_thread_id=${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}"
            --form-string "parse_mode=HTML"
            --form-string "text=$MSG"
            --form-string "link_preview_options=$PREVIEW_OPTIONS"
            --form-string "reply_markup=$BUTTONS"
          )

          # 如果成功获取到了媒体组的 ID，则让文本消息强制引用（回复）它
          if [ -n "$LAST_MSG_ID" ]; then
            MSG_ARGS+=(--form-string "reply_to_message_id=$LAST_MSG_ID")
          fi

          # 6. 发送最终的详细文本消息（带功能按钮并引用文件）
          curl -LSs -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage "${MSG_ARGS[@]}"
